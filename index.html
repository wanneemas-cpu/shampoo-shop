<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HERBALGLOW SHAMPOO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #print-area, #print-area * { visibility: visible; }
      #print-area { position: absolute; left: 0; top: 0; width: 100%; border: 2px solid #000; padding: 20px; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-stone-50 text-stone-800 p-4">
  <div class="max-w-4xl mx-auto">
    <!-- เมนูสลับหน้า -->
    <div class="flex justify-between items-center bg-emerald-800 text-white p-4 rounded-xl mb-6 no-print">
      <h1 class="font-bold text-lg">🌿 HERBALGLOW SHAMPOO</h1>
      <div class="flex gap-2">
        <button onclick="showTab('shop')" class="bg-white text-emerald-900 px-3 py-1.5 rounded font-bold text-sm">หน้าร้านค้า</button>
        <button onclick="showTab('pack')" class="bg-emerald-600 px-3 py-1.5 rounded font-bold text-sm">📦 แพ็คพัสดุ</button>
      </div>
    </div>

    <!-- หน้าสั่งซื้อ -->
    <div id="tab-shop" class="space-y-6">
      <div class="grid md:grid-cols-2 gap-4" id="products"></div>

      <form id="order-form" class="bg-white p-5 rounded-xl shadow space-y-3">
        <h2 class="font-bold text-lg">🛒 ข้อมูลผู้รับ</h2>
        <div id="summary" class="bg-stone-100 p-3 rounded text-sm">ยังไม่ได้เลือกสินค้า</div>
        <input id="name" required placeholder="ชื่อ-นามสกุล ผู้รับ" class="w-full border p-2 rounded" />
        <input id="phone" required placeholder="เบอร์โทรศัพท์" class="w-full border p-2 rounded" />
        <textarea id="address" required placeholder="ที่อยู่จัดส่ง" class="w-full border p-2 rounded"></textarea>
        <button id="send-btn" type="submit" class="w-full bg-emerald-700 text-white font-bold py-2.5 rounded-lg">
          ยืนยันการสั่งซื้อ
        </button>
      </form>
    </div>

    <!-- หน้าหยิบ & แพ็คพัสดุ -->
    <div id="tab-pack" class="hidden space-y-4">
      <div class="flex justify-between items-center no-print">
        <h2 class="font-bold text-xl">📦 รายการสั่งซื้อ & แพ็คพัสดุ</h2>
        <button onclick="loadOrders()" class="bg-stone-800 text-white px-3 py-1.5 rounded text-sm">🔄 โหลดใหม่</button>
      </div>
      <div id="orders" class="space-y-3 no-print">กำลังโหลด...</div>

      <!-- ใบจ่าหน้า -->
      <div id="modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white p-5 rounded-xl max-w-md w-full">
          <div id="print-area" class="border-2 border-black p-4 text-sm space-y-2">
            <div class="flex justify-between border-b pb-2 font-bold">
              <span>HERBALGLOW SHOP</span>
              <span id="p-id"></span>
            </div>
            <div>
              <p class="text-xs text-gray-500">ผู้รับ:</p>
              <p id="p-name" class="font-bold text-base"></p>
              <p id="p-phone"></p>
              <p id="p-address"></p>
            </div>
            <div class="border-t pt-2">
              <p class="font-bold">รายการหยิบสินค้า:</p>
              <p id="p-items"></p>
              <p id="p-total" class="font-bold text-right mt-1"></p>
            </div>
          </div>
          <div class="flex gap-2 mt-4 no-print">
            <button onclick="window.print()" class="flex-1 bg-emerald-700 text-white py-2 rounded font-bold">🖨️ พิมพ์ใบจ่าหน้า</button>
            <button onclick="closeModal()" class="bg-stone-200 px-4 py-2 rounded">ปิด</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyBlIxpdavpmFd3Jjf7s0BUG8cFPWQamnMv18mYdHPwMV35DpqTkeNMLQOeAp47sBa4EA/exec';

    const ITEMS = [
      { sku: 'SKU-SHP-01', name: 'แชมพูสูตรลดผมขาดหลุดร่วง (300 ml)', price: 250, img: './images/shampoo-01.jpg' },
      { sku: 'SKU-SHP-02', name: 'แชมพูสูตรฟื้นฟูผมแห้งเสีย (300 ml)', price: 290, img: './images/shampoo-02.jpg' }
    ];

    let qty = { 'SKU-SHP-01': 0, 'SKU-SHP-02': 0 };

    function render() {
      document.getElementById('products').innerHTML = ITEMS.map(i => `
        <div class="bg-white p-4 rounded-xl shadow flex flex-col justify-between">
          <div>
            <img src="${i.img}" onerror="this.src='https://placehold.co/600x350?text=${i.sku}'" class="w-full h-44 object-cover rounded-lg mb-3 bg-stone-100" />
            <p class="text-xs text-stone-500">${i.sku}</p>
            <h3 class="font-bold">${i.name}</h3>
          </div>
          <div class="flex justify-between items-center mt-4 pt-3 border-t">
            <span class="font-bold text-emerald-700 text-lg">฿${i.price}</span>
            <div class="flex items-center gap-2">
              <button type="button" onclick="changeQty('${i.sku}', -1)" class="w-7 h-7 rounded bg-stone-200 font-bold">-</button>
              <span id="q-${i.sku}" class="font-bold w-5 text-center">${qty[i.sku]}</span>
              <button type="button" onclick="changeQty('${i.sku}', 1)" class="w-7 h-7 rounded bg-emerald-700 text-white font-bold">+</button>
            </div>
          </div>
        </div>
      `).join('');

      let lines = [], total = 0;
      ITEMS.forEach(i => {
        if (qty[i.sku] > 0) {
          const sum = qty[i.sku] * i.price;
          total += sum;
          lines.push(`${i.sku} x${qty[i.sku]} = ฿${sum}`);
        }
      });
      document.getElementById('summary').innerHTML = lines.length
        ? lines.join('<br>') + `<div class="font-bold text-emerald-800 mt-1">รวม: ฿${total}</div>`
        : 'ยังไม่ได้เลือกสินค้า';
    }

    function changeQty(sku, diff) {
      qty[sku] = Math.max(0, qty[sku] + diff);
      render();
    }

    document.getElementById('order-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      let list = [], total = 0;
      ITEMS.forEach(i => {
        if (qty[i.sku] > 0) {
          list.push(`${i.sku} (${i.name}) x${qty[i.sku]}`);
          total += qty[i.sku] * i.price;
        }
      });
      if (!list.length) return alert('เลือกสินค้าก่อนครับ');

      const btn = document.getElementById('send-btn');
      btn.disabled = true;
      btn.innerText = 'กำลังบันทึก...';

      try {
        // ใช้ text/plain เพื่อลดปัญหา CORS กับ Google Apps Script
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'create',
            customerName: document.getElementById('name').value,
            phone: document.getElementById('phone').value,
            address: document.getElementById('address').value,
            items: list.join(' | '),
            totalPrice: total
          })
        });
        const data = await res.json();
        alert('สั่งซื้อสำเร็จ! เลขที่: ' + (data.orderId || 'เรียบร้อย'));
        e.target.reset();
        qty = { 'SKU-SHP-01': 0, 'SKU-SHP-02': 0 };
        render();
      } catch {
        alert('เชื่อมต่อไม่สำเร็จ ลองกด Deploy > New version ใน Apps Script อีกครั้งครับ');
      } finally {
        btn.disabled = false;
        btn.innerText = 'ยืนยันการสั่งซื้อ';
      }
    });

    function showTab(tab) {
      document.getElementById('tab-shop').classList.toggle('hidden', tab !== 'shop');
      document.getElementById('tab-pack').classList.toggle('hidden', tab !== 'pack');
      if (tab === 'pack') loadOrders();
    }

    async function loadOrders() {
      const box = document.getElementById('orders');
      box.innerHTML = 'กำลังโหลด...';
      try {
        const res = await fetch(SCRIPT_URL);
        const rows = await res.json();
        if (!rows.length) return box.innerHTML = 'ยังไม่มีออเดอร์';
        box.innerHTML = rows.reverse().map(o => `
          <div class="bg-white p-4 rounded-xl shadow flex flex-col md:flex-row justify-between gap-3">
            <div class="text-sm space-y-1">
              <p class="font-bold text-emerald-800">${o.OrderID} • <span class="text-stone-700">${o.Status || 'รอดำเนินการ'}</span></p>
              <p class="font-bold">${o.CustomerName} (${o.Phone})</p>
              <p class="text-stone-600">${o.Address}</p>
              <p class="bg-stone-100 p-2 rounded">📋 ${o.Items} (฿${o.TotalPrice})</p>
            </div>
            <div class="flex flex-col gap-2">
              <button onclick='openLabel(${JSON.stringify(o)})' class="bg-stone-800 text-white px-3 py-2 rounded text-sm font-bold">🏷️ ใบจ่าหน้า</button>
              <button onclick="packOrder('${o.OrderID}')" class="bg-emerald-600 text-white px-3 py-2 rounded text-sm font-bold">✅ แพ็คแล้ว</button>
            </div>
          </div>
        `).join('');
      } catch {
        box.innerHTML = 'โหลดข้อมูลไม่สำเร็จ';
      }
    }

    async function packOrder(orderId) {
      const tracking = 'TH' + Math.floor(100000000 + Math.random() * 900000000);
      await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'updateStatus', orderId, status: 'แพ็คแล้ว', trackingNo: tracking })
      });
      alert('แพ็คแล้ว! เลขพัสดุ: ' + tracking);
      loadOrders();
    }

    function openLabel(o) {
      document.getElementById('p-id').innerText = o.OrderID;
      document.getElementById('p-name').innerText = o.CustomerName;
      document.getElementById('p-phone').innerText = 'โทร: ' + o.Phone;
      document.getElementById('p-address').innerText = o.Address;
      document.getElementById('p-items').innerText = o.Items;
      document.getElementById('p-total').innerText = 'ยอดสุทธิ: ฿' + o.TotalPrice;
      const m = document.getElementById('modal');
      m.classList.remove('hidden');
      m.classList.add('flex');
    }

    function closeModal() {
      const m = document.getElementById('modal');
      m.classList.add('hidden');
      m.classList.remove('flex');
    }

    render();
  </script>
</body>
</html>
